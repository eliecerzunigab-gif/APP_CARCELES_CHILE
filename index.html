<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔒 SISGEN - Sistema de Gestión de Seguridad Penitenciaria</title>
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <style>
    body { 
      background: #0a0e1a; 
      color: #fff; 
      font-family: sans-serif; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0;
    }
    .loading { text-align: center; }
    .loading h1 { font-size: 2em; margin-bottom: 10px; }
    .loading p { color: #888; }
    .spinner { 
      width: 40px; height: 40px; 
      border: 4px solid #1a237e; 
      border-top-color: #00bcd4; 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading">
    <h1>🔒 SISGEN</h1>
    <p>Cargando Sistema de Gestión de Seguridad Penitenciaria...</p>
    <div class="spinner"></div>
    <p><small>Redirigiendo al dashboard...</small></p>
  </div>
</body>
</html>
